name: Localize remote images

# Downloads the remote images the prototype uses into dist/assets/images/
# and commits them (with rewritten references) back to the triggering branch.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - scripts/localize-images.py
      - .github/workflows/localize-images.yml

permissions:
  contents: write

concurrency:
  group: localize-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images and rewrite references
        run: python3 scripts/localize-images.py
      - name: Commit results
        run: |
          git add -A dist
          if git diff --cached --quiet; then
            echo "Nothing to commit: images are already local."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: store prototype images locally in dist/assets/images" \
                     -m "Generated by scripts/localize-images.py in the Localize remote images workflow."
          git push origin "HEAD:${GITHUB_REF_NAME}"
